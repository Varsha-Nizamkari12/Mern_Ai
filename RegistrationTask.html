<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
      <link rel="stylesheet" href="RegistrationTask.css">
</head>
<body>
    <div class="dimen">
        <form action="response.html" method="post">
            <h1>Student Registration Form</h1>
            <label for="id"><b>Student Id:</b></label>
            <input type="text" name="id" required >
            <br><br>
            <label for="sname"><b>Student Name:</b></label>
            <input type="text" name="sname" required>
            <br><br>
            <label for="email"><b>Email Id:</b></label>
            <input type="email" name="email" required>
            <br><br>
            <label for="mobile"><b>Mobile Number:</b></label>
            <input type="tel" name="mobile" pattern=""[0-9]{10} required>
            <br><br>
            <label for="course" ><b>Enter Your course:</b></label>
            <select id="coure" name="course" required>
                <option value=""><b>-- Select Course --</b></option>
                <option value="java">Java</option>
                <option value="python">Python</option>
                <option value="mern">Mern</option>
                <option value="ai">Ai</option>
         </select>
         <br><br>
            <label for="dob"><b>Date of Birth:</b></label>
            <input type="date" name="dob" required>
            <br><br>
            
            <button type="reset"><b>Reset</b></button>
             <button type="submit"><b>Register</b></button>
        </form>
    </div>

</body>
</html>
